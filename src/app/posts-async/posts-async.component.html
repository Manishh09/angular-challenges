@if (posts$ | async; as state) {
  @if (state.isLoading) {
    <div class="loading">
      Loading...
    </div>
  } @else if (state.error) {
    <div class="error">
      {{ state.error }}
      <button (click)="refreshData()" class="refresh-button">
        Try Again
      </button>
    </div>
  } @else {
    <div class="posts-container">
      <!-- Refresh Button -->
      <button (click)="refreshData()" class="refresh-button">
        Refresh Data
      </button>

      <!-- Posts List -->
      @if (state.posts.length > 0) {
        <div class="posts-list">
          @for (post of state.posts; track post.id) {
            <article class="post-card">
              <h2>{{ post.title }}</h2>
              <p>{{ post.body }}</p>
            </article>
          }
        </div>
      } @else {
        <div class="no-posts">
          No posts available.
        </div>
      }
    </div>
  }
}
